# CI for the fork. Replaces upstream's ci-workflow.yml (17-job matrix + coveralls, which
# needs a coveralls account) with a smaller matrix. `workflow_dispatch` lets the autose
# release stage start CI for bot branches: pushes and PRs made with GITHUB_TOKEN do not
# trigger workflows, dispatch does.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install test dependencies
        run: python -m pip install "pytest~=9.0" "pytest-cov~=7.0" "pyyaml~=6.0" mypy "types-PyYAML~=6.0"
      - name: Run test suite
        run: python -m pytest -q
      - name: Type check
        if: matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest'
        run: python -m mypy tinydb
